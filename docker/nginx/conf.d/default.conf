server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    # Laravel public directory for PHP handling
    root /var/www/html/public;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss: https:; frame-ancestors 'none';";

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Health check for Laravel backend
    location = /up {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # WebSocket endpoint for Reverb (proxied to Laravel Reverb on port 8083)
    location /app/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Broadcasting auth endpoint (handled by Laravel PHP) - exact match
    location = /broadcasting/auth {
        fastcgi_pass php_backend;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # API endpoints (handled by Laravel PHP) - prefix match
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # React frontend - serve from /usr/share/nginx/html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # PHP handling for Laravel
    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # Deny access to sensitive files
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /storage/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /bootstrap/cache/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static assets caching - try React build first, then Laravel public
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Try React build first
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
}