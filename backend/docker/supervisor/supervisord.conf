[supervisord]
nodaemon=true
user=laravel
logfile=/var/log/supervisord.log
loglevel=info
pidfile=/var/run/supervisord.pid

[program:laravel-app]
command=php artisan serve --host=0.0.0.0 --port=8000
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/log/laravel-app.log
stderr_logfile=/var/log/laravel-app.err.log
user=laravel

[program:reverb]
command=php artisan reverb:start --host=0.0.0.0 --port=8083
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/log/reverb.log
stderr_logfile=/var/log/reverb.err.log
user=laravel